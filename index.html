<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체대입시 실기 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 폰 우선 한 줄(최대 560px), 위에 고정 바, 아래 탭 바. 밝은 블루 한 가지 테마(의도된 단일 테마). 영상 영역만 어둡게. */
:root{
  color-scheme:light;
  --bg:#F3F6FF; --card:#FFFFFF; --soft:#EAF0FF; --ink:#161B33; --ink2:#525A7A; --ink3:#8C93AD; --line:#E1E7F8;
  --accent:#3D5BFF; --accent-ink:#2238C9; --accent-soft:#DDE4FF; --tape:#FFD164; --stage:#0E1320;
  --good:#12A150; --warn:#C97800; --bad:#E5484D;
  --shadow:0 2px 0 rgba(34,56,201,.07),0 8px 24px rgba(34,56,201,.08);
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --num:"Barlow Condensed","Black Han Sans",sans-serif;
  --body:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
section{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:.95rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:.85rem} .hidden{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;transition:transform .08s}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 var(--accent-ink)}
button.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-ink)}
button.block{width:100%;padding:14px;font-size:1.05rem}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{border-color:transparent;background:transparent;color:var(--ink2);padding:6px 10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=number],input[type=text],select{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:9px 11px;min-width:0}
input[type=number]{width:88px}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .between{justify-content:space-between}

/* 상단 바, 탭 바 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.4rem;color:var(--accent-ink);min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.sp{flex:1}
.icon-btn{width:38px;height:38px;padding:0;border-radius:50%;background:var(--soft);border:0;color:var(--accent-ink);font-size:1.1rem;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 11px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill.good{background:#E0F6E9;color:var(--good)} .pill.warn{background:#FFF1D2;color:#9A6500} .pill.bad{background:#FDE4E4;color:var(--bad)} .pill.info{background:var(--soft);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)} .dot.ok{background:var(--good)} .dot.err{background:var(--bad)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1.5px solid var(--line);padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabbar button{border:0;background:transparent;border-radius:var(--r-md);padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--ink3)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current=page]{color:var(--accent-ink);background:var(--soft)}

/* 홈 */
.hello{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 0 var(--accent-ink),0 12px 28px rgba(34,56,201,.25)}
.hello h1{font-size:1.5rem} .hello p{color:#DDE4FF}
.bests{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.best{flex:none;background:rgba(255,255,255,.14);border-radius:var(--r-md);padding:8px 14px;min-width:104px}
.best b{display:block;font-family:var(--num);font-size:1.7rem;line-height:1;color:var(--tape)} .best span{font-size:.75rem;color:#DDE4FF}
.label{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--ink3)}
.events{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev{text-align:left;border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:4px;min-height:132px;box-shadow:var(--shadow);font-weight:400}
.ev .ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:1.5rem}
.ev b{font-family:var(--display);font-weight:400;font-size:1.08rem;margin-top:4px} .ev .what{font-size:.78rem;color:var(--ink2);line-height:1.35}
.ev .tag{font-size:.72rem;font-weight:700;align-self:flex-start;border-radius:99px;padding:1px 9px;margin-top:auto}
.ev .tag.on{background:var(--accent);color:#fff} .ev .tag.off{background:var(--soft);color:var(--ink3)}
.ev:disabled{opacity:.75;box-shadow:none} .ev:not(:disabled):active{transform:translateY(2px)}
.rec{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px solid var(--line)} .rec:last-child{border-bottom:0}
.rec .v{font-family:var(--num);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;min-width:86px}
.rec .v small{font-size:.85rem;color:var(--ink3);font-family:var(--body)}
.rec .m{flex:1;min-width:0;font-size:.85rem;color:var(--ink2)} .rec .m b{display:block;color:var(--ink);font-size:.95rem}
.spark{width:100%;height:56px;display:block}
.empty{text-align:center;color:var(--ink2);padding:14px 6px;font-size:.9rem}

/* 종목 화면 */
.steps{list-style:none;margin:0;padding:4px;display:flex;gap:4px;background:var(--soft);border-radius:999px}
.steps li{flex:1;text-align:center;font-size:.85rem;font-weight:700;color:var(--ink3);border-radius:999px;padding:6px 4px}
.steps li.on{background:#fff;color:var(--accent-ink);box-shadow:0 2px 6px rgba(34,56,201,.15)}
.guide{margin:0;padding-left:18px;color:var(--ink2);font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.stage{background:var(--stage);border-radius:var(--r-md);overflow:hidden;display:flex;justify-content:center}
.frame{position:relative;width:100%} .frame video{display:block;width:100%;height:auto} .frame canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.frame.pick canvas{cursor:crosshair}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .ctrl button{padding:7px 12px;font-size:.85rem}
.ctrl select{padding:6px 8px;font-size:.85rem;border-radius:999px}
.ctrl .time{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink2);margin-left:auto}
.tl{position:relative;padding-top:22px} .tl input{width:100%;margin:0;accent-color:var(--accent)}
.mk{position:absolute;top:0;transform:translateX(-50%);font-size:.68rem;font-weight:700;line-height:1;padding:3px 5px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);border:0;white-space:nowrap}
.mk.bad{background:#FDE4E4;color:var(--bad)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.set label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--ink2)}
.set label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:.88rem;padding:8px 8px}
.seg button[aria-pressed=true]{background:#fff;color:var(--accent-ink);box-shadow:0 2px 6px rgba(34,56,201,.15)}
.step{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.step i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--tape);color:var(--ink);font-style:normal;font-weight:700;font-size:.8rem;display:grid;place-items:center}
.step.done i{background:var(--good);color:#fff}
progress{width:100%;height:10px;accent-color:var(--accent)}
.err{color:var(--bad);font-weight:600}

/* 결과 */
.hero{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 0 var(--accent-ink),0 12px 28px rgba(34,56,201,.25)}
.hero .muted{color:#DDE4FF} .hero .pill{background:#fff}
.hero button.primary{background:var(--tape);color:var(--ink);border-color:var(--tape);box-shadow:0 3px 0 #D9A92F}
.record{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.big{font-family:var(--num);font-weight:700;font-size:92px;line-height:.86;font-variant-numeric:tabular-nums}
.big small{font-size:30px;font-weight:600;margin-left:4px;color:var(--tape)}
.fouls{display:flex;flex-direction:column;gap:6px}
.foul{padding:8px 12px;background:#FFF1D2;color:#5C3D00;border-radius:var(--r-sm);font-size:.88rem}
.foul.bad{background:#FDE4E4;color:#8A1F23} .foul b{margin-right:6px}
.metric{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1.5px solid var(--line)} .metric:last-child{border-bottom:0}
.metric b{font-size:.92rem}
.metric .val{font-family:var(--num);font-size:1.8rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.metric .val span{font-size:.85rem;color:var(--ink3);font-family:var(--body);font-weight:500}
.metric .sub{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--ink3)}
.gauge{position:relative;flex:1 1 160px;height:10px;border-radius:5px;background:var(--soft)}
.gauge .band{position:absolute;top:0;bottom:0;background:#9FE0BC;border-radius:5px}
.gauge .me,.gauge .rf{position:absolute;top:-4px;width:5px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.gauge .rf{background:var(--accent);height:14px;top:-2px}
.tip{background:var(--soft);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px}
.tip p{font-size:.9rem;color:var(--ink2)}
.tip .ex{display:flex;gap:6px;flex-wrap:wrap} .tip .ex span{font-size:.78rem;font-weight:600;background:#fff;color:var(--accent-ink);border-radius:999px;padding:3px 10px}
.reps{display:flex;gap:5px;flex-wrap:wrap}
.reps button{width:36px;height:32px;padding:0;font-size:.78rem;font-variant-numeric:tabular-nums;border-radius:10px;background:var(--soft);border:0;color:var(--accent-ink)}
.reps button.x{color:var(--bad);background:#FDE4E4}
.bars{display:flex;gap:6px;align-items:flex-end;height:96px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;font-size:.68rem;color:var(--ink3);height:100%}
.bars i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.legend{display:flex;gap:12px;font-size:.75rem;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:5px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media (max-width:380px){.big{font-size:72px}.card{padding:15px}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button id="back" class="icon-btn hidden" aria-label="종목 목록으로">←</button>
    <div class="brand"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#3D5BFF"/><path d="M8 25h20" stroke="#FFD164" stroke-width="3" stroke-linecap="round"/><path d="M10 21c3-12 11-12 16-2" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="26" cy="19" r="2.6" fill="#fff"/></svg><span id="barTitle">실기핏</span></div>
    <span class="sp"></span><span class="pill"><span class="dot" id="engDot"></span><span id="engTxt">엔진 불러오는 중</span></span>
  </header>

  <section id="home" class="hidden">
    <div class="card hello"><div><h1 id="hello">오늘은 뭘 재 볼까요?</h1><p class="small">영상 한 편이면 기록과 자세를 같이 봅니다. 영상은 이 기기 밖으로 나가지 않아요.</p></div><div class="bests" id="bests"></div></div>
    <span class="label">종목</span>
    <div class="events" id="events"></div>
    <div class="card"><div class="row between"><h2>최근 기록</h2><button class="ghost" id="moreRec">전체 보기</button></div><div id="recent"></div></div>
  </section>

  <section id="records" class="hidden">
    <h1>기록</h1>
    <div id="trend" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="card"><h2>전체 기록</h2><div id="history"></div></div>
  </section>

  <section id="my" class="hidden">
    <h1>내 정보</h1>
    <div class="card"><div class="set">
      <label for="athlete">이름<input type="text" id="athlete" placeholder="이름"></label>
      <label for="myH">키 (제멀 "키로 어림"에 사용)<span class="row"><input type="number" id="myH" step="1"> cm</span></label></div></div>
    <div class="card"><h2>판정 기준</h2><p class="small muted">종목 화면에서 바꾼 기준은 이 기기에 기억됩니다. 처음 값으로 되돌릴 수 있어요.</p><div class="row"><button id="resetCfg">기준 처음으로</button><span class="small muted" id="resetMsg"></span></div></div>
    <div class="card"><h2>저장 데이터</h2><p class="small muted">기록은 지금 이 기기의 브라우저에만 저장됩니다. 다른 기기와 공유하는 기능은 배포 후에 붙습니다.</p><div class="row"><button id="wipe">기록 모두 지우기</button><span class="small muted" id="wipeMsg"></span></div></div>
  </section>

  <section id="work" class="hidden">
    <ol class="steps"><li id="st1" class="on">1 영상</li><li id="st2">2 기준</li><li id="st3">3 결과</li></ol>
    <div class="card">
      <h2>영상 넣기</h2>
      <ul class="guide" id="guide"></ul>
      <div class="row">
        <button class="primary" id="btnShoot">지금 촬영</button><button id="btnPick">찍어 둔 영상</button>
        <input type="file" id="fShoot" accept="video/*" capture="environment" class="hidden"><input type="file" id="fPick" accept="video/*" class="hidden">
      </div><span class="small muted" id="fileName"></span>
    </div>
    <div class="card hidden" id="playerCard">
      <div id="player"></div>
      <div class="row small"><span class="muted">분석 구간</span><button id="trimA">여기부터</button><button id="trimB">여기까지</button><span id="trimTxt" class="muted"></span></div>
    </div>
    <div class="card hidden" id="setupCard">
      <h2>기준 맞추기</h2>
      <div id="setup"></div>
      <button class="primary block" id="btnRun">분석 시작</button><span class="small muted" id="runHint"></span>
      <progress id="prog" class="hidden" max="1" value="0"></progress>
      <p class="err hidden" id="runErr"></p>
    </div>
    <div id="results" class="hidden" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>
</div>
<nav class="tabbar" aria-label="메뉴"><div>
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-tab="records"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>기록</button>
  <button data-tab="my"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>내 정보</button>
</div></nav>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + s.toFixed(2).padStart(5, '0'); };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const EVENTS = [
  { id: 'jump', ico: '🤾', name: '제자리멀리뛰기', what: '거리, 구름선·착지 파울, 반동과 팔 스윙', on: true, fps: 30,
    guide: ['카메라를 뛰는 방향의 옆(직각)에 두고 삼각대나 벽에 고정합니다.', '구름선부터 착지 지점 너머까지 한 화면에 담습니다. 발이 잘리면 거리를 못 잽니다.', '구름선에서 2m 되는 바닥에 테이프를 붙여 두면 거리 기준으로 씁니다.', '준비 자세부터 착지 후 1초까지 찍습니다. 60fps면 더 정확합니다.'] },
  { id: 'situp', ico: '💪', name: '윗몸일으키기', what: '기준 충족한 횟수만 카운트, 무효 사유, 페이스', on: true, fps: 15,
    guide: ['카메라를 몸 옆, 매트 높이쯤에 고정합니다.', '머리부터 발끝까지 화면에 담습니다.', '발을 잡아 주는 사람이 무릎과 엉덩이를 가리지 않게 합니다.', '시작 전 누운 자세부터 끝날 때까지 끊지 않고 찍습니다.'] },
  { id: 'run10', ico: '🏃', name: '10m 왕복달리기', what: '출발선 통과~복귀 시간, 스타트, 턴', stage: 2 },
  { id: 'run20', ico: '⚡', name: '20m 왕복달리기', what: '구간 시간, 가속, 턴', stage: 2 },
  { id: 'shuttle', ico: '🔁', name: '셔틀런', what: '신호음, 레벨·횟수, 탈락 판정', stage: 2 },
  { id: 'flex', ico: '🧘', name: '유연성 (좌전굴)', what: '도달 거리, 무릎 굽힘·반동', stage: 3 },
  { id: 'sargent', ico: '🚀', name: '서전트 점프', what: '점프 높이, 반동, 팔 스윙', stage: 3 }
];
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

/* ── 영상 플레이어 + 관절 오버레이 ── */
const BONES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [27, 29], [29, 31], [27, 31], [24, 26], [26, 28], [28, 30], [30, 32], [28, 32]];

        <select data-a="rate" aria-label="재생 속도"><option value="1">1배속</option><option value="0.5">0.5배속</option><option value="0.25">0.25배속</option></select>

    ['seeked', 'timeupdate', 'loadeddata'].forEach(n => this.v.addEventListener(n, () => this.draw()));
    this.v.addEventListener('play', () => { $('[data-a=play]', host).textContent = '멈춤'; const loop = () => { this.draw(); if (!this.v.paused) requestAnimationFrame(loop); }; loop(); });

  }

  }

/* ── 프레임별 관절 추출 ── */
function seekTo(v, t) {
  return new Promise((res) => {
    if (Math.abs(v.currentTime - t) < 1e-3 && v.readyState >= 2) return res();
    const done = () => { clearTimeout(to); v.removeEventListener('seeked', done); res(); }, to = setTimeout(done, 2500);
    v.addEventListener('seeked', done); v.currentTime = t;
  });
}
async function extract(pl, fps, onProg) {
  await engine.init(); pl.v.pause(); pl.fps = fps;
  const [a, b] = pl.trim, n = Math.max(1, Math.floor((b - a) * fps)), out = [];
  for (let i = 0; i <= n; i++) {
    const t = Math.min(pl.dur - 0.001, a + i / fps); await seekTo(pl.v, t);
    const lm = await engine.detect(pl.v);
    out.push({ t, p: lm ? lm.map(q => [q.x * pl.W, q.y * pl.H, q.visibility ?? 1]) : null });
    pl.frames = out; if (i % 3 === 0) { pl.draw(); onProg(i / n); await new Promise(r => setTimeout(r)); }
  }

}

/* ── 분석 실행 ── */

  const c = cfgOf(app.ev.id);

  if (!isRef && c.calibMode === 'line' && pl.pts.length === 2) {
    const [p, q] = pl.pts, d = Math.hypot(q.x - p.x, q.y - p.y);
    return { cfg: c, pxPerCm: d / c.markCm, line: { x: p.x }, ground: { k: (q.y - p.y) / ((q.x - p.x) || 1e-9) } };
  }

}
function compute(pl, isRef) {

  pl.result = Analysis[app.ev.id === 'jump' ? 'analyzeJump' : 'analyzeSitup'](pl.frames, optsFor(pl, isRef));
  pl.setMarkers(pl.result.ok ? pl.result.events : []); pl.draw();
}

  }
  h += `<div class="card"><div class="row between"><h2>자세 지표</h2><div class="legend"><span><i style="background:var(--ink)"></i>나</span>${rr ? '<span><i style="background:var(--accent)"></i>비교 영상</span>' : ''}<span><i style="background:#9FE0BC;width:14px"></i>권장 범위</span></div></div><div>
    ${r.metrics.map(m => `<div class="metric"><div><b>${esc(m.label)}</b></div><div class="val">${m.value}<span> ${m.unit}</span></div>
      <div class="sub"><span class="pill ${m.verdict === 'good' ? 'good' : m.verdict === 'info' ? 'info' : 'warn'}">${VTXT[m.verdict]}</span>${gauge(m, rmap[m.key])}${m.ref ? `<span>권장 ${m.ref[0]}~${m.ref[1]}${m.unit}</span>` : ''}${rmap[m.key] != null ? `<span>비교 ${rmap[m.key]}${m.unit}</span>` : ''}</div></div>`).join('')}
    </div><p class="small muted">권장 범위는 일반적인 지도 기준입니다. 체형과 영상 각도에 따라 5~10° 차이가 날 수 있으니 같은 조건으로 찍은 내 기록끼리 비교하는 것이 가장 믿을 만합니다.</p></div>`;
  h += `<div class="card"><h2>고칠 점과 보강운동</h2>${r.tips.length ? r.tips.map(t => `<div class="tip"><h3>${esc(t.p)}</h3><p>${esc(t.fix)}</p>${t.ex.length ? `<div class="ex">${t.ex.map(e => `<span>${esc(e)}</span>`).join('')}</div>` : ''}</div>`).join('') : '<p>지표가 모두 권장 범위 안입니다. 지금 자세를 유지하면서 근력과 순발력을 키우면 기록이 따라옵니다.</p>'}</div>`;
  h += `<div class="card"><h2>잘하는 사람과 비교</h2><p class="small muted">기록이 좋은 사람의 영상을 같은 방향에서 찍어 넣으면 지표를 나란히 보여 줍니다.</p>
    <div class="row"><button id="btnRef">비교 영상 선택</button><input type="file" id="fRef" accept="video/*" class="hidden">${isJ ? `<label class="small muted" for="refH">비교 대상 키 <input type="number" id="refH" value="${cfgOf('jump').refHeightCm}"> cm</label>` : ''}<span class="small muted" id="refMsg"></span></div>
    <progress id="refProg" class="hidden" max="1" value="0"></progress><div id="refPlayer"></div>
    <div class="row ${rr ? '' : 'hidden'}"><button id="btnSync">${isJ ? '도약 순간' : '시작 시점'}을 맞춰 함께 재생 (0.5배속)</button></div></div>`;
  host.innerHTML = h;
  if (app.ref) { $('#refPlayer').replaceWith(app.ref.host); app.ref.host.id = 'refPlayer'; }
  host.querySelectorAll('.reps button').forEach(b => b.onclick = () => { app.me.seek(+b.dataset.t); $('#playerCard').scrollIntoView({ block: 'nearest' }); });
  $('#btnSave').onclick = () => saveRecord(r);
  $('#btnRef').onclick = () => $('#fRef').click();
  $('#fRef').onchange = (e) => e.target.files[0] && loadRef(e.target.files[0]);
  const rh = $('#refH'); if (rh) rh.onchange = () => { cfgOf('jump').refHeightCm = +rh.value; recompute(); };
  $('#btnSync').onclick = () => { [app.me, app.ref].forEach(p => { p.v.playbackRate = 0.5; p.v.currentTime = Math.max(0, p.result.anchor - 1); }); setTimeout(() => [app.me, app.ref].forEach(p => p.v.play().catch(() => { })), 300); };
}
async function loadRef(file) {
  const msg = $('#refMsg'), prog = $('#refProg');
  try {
    if (!app.ref) { const h = document.createElement('div'); $('#refPlayer').replaceWith(h); h.id = 'refPlayer'; app.ref = new Player(h, '비교 영상'); }
    await app.ref.load(file); prog.classList.remove('hidden');
    await extract(app.ref, cfgOf(app.ev.id).fps || app.ev.fps, (v) => { prog.value = v; msg.textContent = '비교 영상 추적 중 ' + Math.round(v * 100) + '%'; });
    compute(app.ref, true); renderResults();
    $('#refMsg').textContent = app.ref.result.ok ? '' : '비교 영상: ' + app.ref.result.error;
  } catch (e) { msg.textContent = '비교 영상을 분석하지 못했습니다: ' + e.message; prog.classList.add('hidden'); }
}

/* ── 기록 저장 ── */
const evName = (id) => (EVENTS.find(e => e.id === id) || {}).name || id;
function saveRecord(r) {
  const list = store.get('pe.history', []);
  list.unshift({ id: Date.now(), ev: app.ev.id, name: app.name, at: new Date().toISOString(), value: r.record.value, unit: r.record.unit, ok: !r.fouls.some(f => f.sev === 'bad'), note: r.fouls.map(f => f.label).join(', ') });
  store.set('pe.history', list.slice(0, 200)); $('#saveMsg').textContent = '저장했어요. 기록 탭에서 볼 수 있습니다.';
}
const day = (x) => new Date(x.at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
function recRow(x, del) {
  return `<div class="rec"><div class="v">${x.value}<small> ${x.unit}</small></div><div class="m"><b>${evName(x.ev)}</b>${day(x)}${x.name ? ' · ' + esc(x.name) : ''}</div><span class="pill ${x.ok ? (x.note ? 'warn' : 'good') : 'bad'}">${x.ok ? (x.note ? '확인 필요' : '인정') : '파울'}</span>${del ? `<button class="ghost" data-del="${x.id}" aria-label="기록 삭제">삭제</button>` : ''}</div>`;
}
function bestsOf(list) { const b = {}; list.filter(x => x.ok).forEach(x => { if (!b[x.ev] || x.value > b[x.ev].value) b[x.ev] = x; }); return b; }
function renderHome() {
  const list = store.get('pe.history', []), b = bestsOf(list);
  $('#hello').textContent = app.name ? `${app.name} 님, 오늘은 뭘 재 볼까요?` : '오늘은 뭘 재 볼까요?';
  $('#bests').innerHTML = Object.keys(b).map(k => `<div class="best"><b>${b[k].value}${b[k].unit}</b><span>${evName(k)} 최고</span></div>`).join('');
  $('#events').innerHTML = EVENTS.map(e => `<button class="ev" data-ev="${e.id}" ${e.on ? '' : 'disabled'}><span class="ico" aria-hidden="true">${e.ico}</span><b>${e.name}</b><span class="what">${e.what}</span><span class="tag ${e.on ? 'on' : 'off'}">${e.on ? '측정하기' : '곧 추가'}</span></button>`).join('');
  $('#events').querySelectorAll('button:not(:disabled)').forEach(x => x.onclick = () => { location.hash = x.dataset.ev; });
  $('#recent').innerHTML = list.length ? list.slice(0, 3).map(x => recRow(x)).join('') : '<p class="empty">아직 저장한 기록이 없어요. 종목을 골라 첫 기록을 남겨 보세요.</p>';
}
function spark(vals, unit) {
  const W = 300, H = 56, lo = Math.min(...vals), hi = Math.max(...vals), sp = (hi - lo) || 1, n = vals.length;
  const pt = vals.map((v, i) => [n === 1 ? W / 2 : 8 + i * (W - 16) / (n - 1), H - 10 - (v - lo) / sp * (H - 22)]);
  const d = pt.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' '), last = pt[n - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="기록 변화, 최근 ${vals[n - 1]}${unit}"><path d="${d} L${last[0]} ${H} L${pt[0][0]} ${H} Z" fill="#DDE4FF"/><path d="${d}" fill="none" stroke="#3D5BFF" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#3D5BFF"/></svg>`;
}
function renderRecords() {
  const list = store.get('pe.history', []), b = bestsOf(list);
  $('#trend').innerHTML = Object.keys(b).map(k => { const rows = list.filter(x => x.ev === k && x.ok).reverse(), vals = rows.map(x => x.value), last = vals[vals.length - 1], prev = vals[vals.length - 2];
    return `<div class="card"><div class="row between"><h2>${evName(k)}</h2><span class="pill">${vals.length}회 측정</span></div><div class="rec" style="border:0;padding:0"><div class="v">${b[k].value}<small> ${b[k].unit} 최고</small></div><div class="m">최근 ${last}${b[k].unit}${prev != null ? ` (직전보다 ${last - prev >= 0 ? '+' : ''}${Math.round((last - prev) * 10) / 10})` : ''}</div></div>${spark(vals, b[k].unit)}</div>`; }).join('');
  const host = $('#history');
  host.innerHTML = list.length ? list.slice(0, 50).map(x => recRow(x, true)).join('') : '<p class="empty">아직 저장한 기록이 없어요.</p>';
  host.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { store.set('pe.history', store.get('pe.history', []).filter(y => y.id !== +x.dataset.del)); renderRecords(); });
}

/* ── 화면 전환 ── */
const TABS = ['home', 'records', 'my'];
function show(id) {
  [...TABS, 'work'].forEach(t => $('#' + t).classList.toggle('hidden', t !== id));
  document.querySelectorAll('.tabbar button').forEach(x => { if (x.dataset.tab === id) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
  $('#back').classList.toggle('hidden', id !== 'work'); if (id !== 'work') $('#barTitle').textContent = '실기핏';
  window.scrollTo(0, 0);
}
function showTab(id) { show(id); if (id === 'home') renderHome(); if (id === 'records') renderRecords(); if (id === 'my') { $('#athlete').value = app.name; $('#myH').value = cfgOf('jump').heightCm; } }
function setStep(n) { [1, 2, 3].forEach(i => $('#st' + i).classList.toggle('on', i === n)); }
function showEvent(ev) {
  app.ev = ev; app.me = null; app.ref = null; show('work'); setStep(1);
  $('#barTitle').textContent = ev.name; $('#guide').innerHTML = ev.guide.map(g => `<li>${g}</li>`).join('');
  ['#playerCard', '#setupCard', '#results'].forEach(s => $(s).classList.add('hidden')); $('#results').innerHTML = ''; $('#fileName').textContent = '';
}
async function loadMain(file) {
  if (!file) return; $('#fileName').textContent = file.name;
  $('#playerCard').classList.remove('hidden'); $('#setupCard').classList.remove('hidden'); $('#results').classList.add('hidden'); $('#runErr').classList.add('hidden');
  app.ref = null; const ph = document.createElement('div'); $('#player').replaceWith(ph); ph.id = 'player'; app.me = new Player(ph);
  try { await app.me.load(file); } catch (e) { $('#runErr').textContent = e.message; $('#runErr').classList.remove('hidden'); return; }
  cfgOf(app.ev.id).startT = null; updTrim(); renderSetup(); setStep(2);
  const sec = Math.round(app.me.dur * (cfgOf(app.ev.id).fps || app.ev.fps) * 0.09);
  $('#runHint').textContent = `영상 ${app.me.dur.toFixed(1)}초 · 추적에 ${sec < 60 ? sec + '초' : Math.round(sec / 60) + '분'}쯤 걸립니다`;
  if (app.ev.id === 'jump' && cfgOf('jump').calibMode === 'line') { app.me.startPick(2); renderSetup(); }
  $('#playerCard').scrollIntoView({ block: 'start' });
}
function updTrim() { const p = app.me; $('#trimTxt').textContent = `${fmt(p.trim[0])} ~ ${fmt(p.trim[1])}`; }
function route() { const h = location.hash.slice(1), ev = EVENTS.find(e => e.on && e.id === h); if (ev) showEvent(ev); else showTab(TABS.includes(h) ? h : 'home'); }
const go = (h) => { if (location.hash.slice(1) === h) route(); else location.hash = h; };

$('#back').onclick = () => go('home');
document.querySelectorAll('.tabbar button').forEach(x => x.onclick = () => go(x.dataset.tab));
$('#moreRec').onclick = () => go('records');
$('#btnShoot').onclick = () => $('#fShoot').click(); $('#btnPick').onclick = () => $('#fPick').click();
$('#fShoot').onchange = (e) => loadMain(e.target.files[0]); $('#fPick').onchange = (e) => loadMain(e.target.files[0]);
$('#btnRun').onclick = run;
$('#trimA').onclick = () => { const p = app.me; p.trim[0] = Math.min(p.v.currentTime, p.trim[1] - 0.5); updTrim(); };
$('#trimB').onclick = () => { const p = app.me; p.trim[1] = Math.max(p.v.currentTime, p.trim[0] + 0.5); updTrim(); };
$('#athlete').oninput = (e) => { app.name = e.target.value; store.set('pe.name', app.name); };
$('#myH').onchange = (e) => { cfgOf('jump').heightCm = +e.target.value || 170; saveCfg(); };
$('#resetCfg').onclick = () => { app.cfg = {}; saveCfg(); $('#myH').value = cfgOf('jump').heightCm; $('#resetMsg').textContent = '처음 값으로 되돌렸어요.'; };
let wipeArmed = 0;
$('#wipe').onclick = (e) => { if (!wipeArmed) { wipeArmed = 1; e.target.textContent = '한 번 더 누르면 지워집니다'; setTimeout(() => { wipeArmed = 0; e.target.textContent = '기록 모두 지우기'; }, 4000); return; } store.set('pe.history', []); wipeArmed = 0; e.target.textContent = '기록 모두 지우기'; $('#wipeMsg').textContent = '모두 지웠어요.'; };
window.addEventListener('hashchange', route);
route(); engineStatus();
</script>
</body>
</html>
